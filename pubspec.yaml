name: hote_v2
description: Hotel booking app inspired by exported Figma screens.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.2
  http: ^1.2.2
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.12.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma_export/
    - assets/
    - assets/figma_export/User Interface/
